name: Test-SingleNode
on:
  workflow_call:
jobs:
  qualif:
      runs-on: ubuntu-latest
      steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run custom action
        # Use the location in the repository (without action.yml)
        uses: ./.github/actions/setup
        with:
          install-chaos: false
      - name: deploy openldap-single-node
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          kubectl create ns single
          kubectl -n single create secret generic my-super-secret --from-literal=LDAP_ADMIN_PASSWORD=Not@SecurePassw0rd
          helm -n single install openldap -f .bin/singleNode-values.yaml .
          kubectl -n single rollout status sts openldap
          kubectl -n single logs openldap-0  
      - name: verify single node deployment
        shell: bash
        run: |
          sleep 10
          echo "test access to openldap database"
          LDAPTLS_REQCERT=never ldapsearch -o nettimeout=20 -x -D 'cn=admin,dc=singlenode,dc=org' -w Not@SecurePassw0rd -H ldap://localhost:30389 -b 'dc=singlenode,dc=org' > /tmp/test-single-node.txt
          cat /tmp/test-single-node.txt
          if [ $(grep "numResponses" /tmp/test-single-node.txt | cut -d ":" -f 2 | tr -d ' ') -ne 16 ]; then exit 1 ; fi
          echo "single node deployment verification completed successfully"
            