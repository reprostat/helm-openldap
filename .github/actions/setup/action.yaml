name: 'Setup env'
description: 'Greet someone'
inputs:
  kind-version:
    description: 'Version of kind to install'
    required: true
    default: 0.33.0
  k8s-version:
    description: 'Version of KIND node and kubectl to install'
    required: true
    default: 1.36.4
  cert-manager-version:
    description: 'Version of cert-manager to install'
    required: true
    default: 1.21.2
  install-chaos:
    description: 'Setup ChaosMesh'
    required: true
    default: false
  chaos-mesh-version:
    description: 'Version of ChaosMesh to install'
    required: true
    default: 2.8.4
runs:
  using: "composite"
  steps:
    - name: Lint
      shell: bash
      run: |
        curl -fsSL -o /tmp/get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
        chmod 700 /tmp/get_helm.sh
        /tmp/get_helm.sh
        helm dependency update
        helm lint .
    - name: setup cluster
      shell: bash
      run: |
        curl -Lo /tmp/kind https://kind.sigs.k8s.io/dl/v${{ inputs.kind-version }}/kind-linux-amd64
        chmod +x /tmp/kind
        curl -LO "https://dl.k8s.io/release/v${{ inputs.k8s-version }}/bin/linux/amd64/kubectl"
        sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
        rm -f kubectl
        sudo apt update
        sudo apt-get install -y ldap-utils
        /tmp/kind create cluster --config=$GITHUB_WORKSPACE/.bin/setup-kind.yml --image=kindest/node:v${{ inputs.k8s-version }}
        kubectl apply -f https://projectcontour.io/quickstart/contour.yaml
        kubectl patch daemonsets -n projectcontour envoy -p '{"spec":{"template":{"spec":{"nodeSelector":{"ingress-ready":"true"}}}}}'
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v${{ inputs.cert-manager-version }}/cert-manager.yaml
        kubectl rollout status deployments -n cert-manager
    - name: setup chaos mesh
      if: ${{ inputs.install-chaos == 'true' }}
      shell: bash
      run: |
        helm repo add chaos-mesh https://charts.chaos-mesh.org
        helm repo update
        helm --namespace chaos-testing install chaos-mesh chaos-mesh/chaos-mesh --create-namespace --version ${{ inputs.chaos-mesh-version }}
