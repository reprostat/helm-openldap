apiVersion: {{ include "common.capabilities.statefulset.apiVersion" . }}
kind: StatefulSet
metadata:
  name:  {{ template "openldap.fullname" . }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ template "openldap.fullname" . }}
    chart: {{ template "openldap.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replication.writeableReplicaCount }}
  selector:
    matchLabels: {{ include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ template "openldap.fullname" . }}
  serviceName: {{ template "openldap.fullname" . }}-headless
  {{- if .Values.updateStrategy }}
  updateStrategy:
{{ toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        {{- if .Values.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
        checksum/configmap-env: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        {{- if .Values.customLdifFiles}}
        checksum/configmap-customldif: {{ include (print $.Template.BasePath "/configmap-customldif.yaml") . | sha256sum }}
        {{- end }}
      labels: {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: {{ template "openldap.fullname" . }}
        release: {{ .Release.Name }}
        {{- if .Values.podLabels }}
        {{- include "common.tplvalues.render" (dict "value" .Values.podLabels "context" $) | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.initContainers }}
      initContainers:
        {{- include "common.tplvalues.render" (dict "value" .Values.initContainers "context" $) | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ template "openldap.serviceAccountName" . }}
      {{- include "openldap.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.hostAliases }}
      hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.hostAliases "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- include "common.tplvalues.render" ( dict "value" .Values.affinity "context" $) | nindent 8 }}
      {{- else if .Values.replication.multipleNodes }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - {{ template "openldap.name" . }}
              topologyKey: "kubernetes.io/hostname"
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" ( dict "value" .Values.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.schedulerName }}
      schedulerName: {{- .Values.schedulerName | quote }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if and (not .Values.global.tlsSecret) .Values.initTLScerts.enabled }}
      initContainers:
        - name: init-tls-certs
          image: {{ include "openldap.initTLScertsImage" . }}
          imagePullPolicy: {{ .Values.initTLScerts.image.pullPolicy }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.initTLScerts.resources }}
          resources: {{- toYaml .Values.initTLScerts.resources | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - |
              cat > /opt/init/certs/tls.cnf <<EOF
              [req]
              prompt = no
              default_bits = 2048
              distinguished_name = req_distinguished_name
              x509_extensions = v3_ca     # For self-signed certs; use v3_req for CSRs
              req_extensions = v3_req     # Required to add SAN to CSR
              
              [req_distinguished_name]
              C = UK                      # Country (2-letter code)
              L = London                  # City
              CN = {{ include "global.baseDomain" . }}    # Primary domain (still required but not used for validation)
              
              [v3_req]
              keyUsage = digitalSignature, keyEncipherment
              extendedKeyUsage = serverAuth
              subjectAltName = @alt_names  # Reference SANs below
              
              [v3_ca]                     # For self-signed certs; includes CA extensions
              keyUsage = digitalSignature, keyEncipherment, keyCertSign
              extendedKeyUsage = serverAuth
              subjectAltName = @alt_names
              basicConstraints = CA:TRUE   # Mark as a CA (for self-signed)
              
              [alt_names]
              DNS.1 = *.{{ template "openldap.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local
              DNS.2 = {{ template "openldap.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
          {{- if .Values.initTLScerts.extraSAN }}
          {{- if hasKey .Values.initTLScerts.extraSAN "DNS" }}
          {{- range $index, $san := .Values.initTLScerts.extraSAN.DNS }}
              DNS.{{ add $index 3 }} = {{ $san }}
          {{- end }}
          {{- end }}
          {{- if hasKey .Values.initTLScerts.extraSAN "IP" }}
          {{- range $index, $san := .Values.initTLScerts.extraSAN.IP }}
              IP.{{ add $index 1 }} = {{ $san }}
          {{- end }}
          {{- end }}
          {{- end }}
              EOF
              openssl req -x509 -newkey rsa:4096 -noenc -config /opt/init/certs/tls.cnf -days 365 -keyout /opt/init/certs/tls.key -out /opt/init/certs/tls.crt -quiet
              cp -pf /opt/init/certs/tls.crt /opt/init/certs/ca.crt
              chmod 644 /opt/init/certs/*
          volumeMounts:
            - name: certs
              mountPath: /opt/init/certs
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "openldap.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args: {{ toYaml . | nindent 12}}
          {{- end }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            {{- if .Values.extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          envFrom:
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsCM "context" $) }}
            {{- end }}
            - configMapRef:
                name: {{ template "openldap.fullname" . }}-env
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsSecret "context" $) }}
            {{- end }}
            - secretRef:
                name: {{ template "openldap.secretName" . }}
          {{- if .Values.resources }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          ports:
            - name: ldap-port
              containerPort: 389
            - name: ssl-ldap-port
              containerPort: 636
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: ldap-port
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- else if .Values.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customLivenessProbe "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: ldap-port
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- else if .Values.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customReadinessProbe "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            tcpSocket:
              port: ldap-port
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            successThreshold: {{ .Values.startupProbe.successThreshold }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- else if .Values.customStartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customStartupProbe "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.lifecycleHooks }}
          lifecycle: {{- include "common.tplvalues.render" (dict "value" .Values.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/ldap/slapd.d
            - name: data
              mountPath: /var/lib/ldap
            - name: passwords
              mountPath: /opt/init/passwords
{{- if or .Values.global.tlsSecret .Values.initTLScerts.enabled }}              
            - name: certs
              mountPath: /opt/init/certs
{{- end }}
            - name: script
              mountPath: /opt/init.sh
              subPath: init.sh
{{- if or .Values.customSchemaFiles .Values.customSchemaCm }}
            - name: custom-schema-files
              mountPath: /opt/init/schemas
{{- end }}
{{- if or .Values.customLdifFiles .Values.customLdifCm }}
            - name: custom-ldif-files
              mountPath: /opt/init/base
{{- end }}
{{- if (gt (int .Values.replication.writeableReplicaCount) 1) }}
            - name: replication
              subPath: init_replication.ldif
              mountPath: /opt/init/config/init_replication.ldif
            - name: replication
              subPath: init_replication_acl.ldif
              mountPath: /opt/init/config/init_replication_acl.ldif
{{- end }}
            - name: ppolicy
              subPath: ppolicy.ldif
              mountPath: /opt/init/config/init_org_ppolicy.ldif              
{{- if .Values.accessLog.enabled }}
            - name: accesslog
              subPath: init_accesslog.ldif
              mountPath: /opt/init/config/init_accesslog.ldif
{{- end }}
{{- if .Values.global.allowConfigAccess }}
            - name: logging
              subPath: init_logging.ldif
              mountPath: /opt/init/config/init_logging.ldif
{{- end }}
{{- range .Values.customFileSets }}
{{- $fs := . }}
{{- range .files }}
            - name: {{ $fs.name }}
              mountPath: {{ $fs.targetPath }}/{{ .filename }}
              subPath: {{ .filename }}
{{- end }}
{{- end }}
{{- if .Values.extraVolumeMounts }}
{{- include "common.tplvalues.render" (dict "value" .Values.extraVolumeMounts "context" $) | nindent 12 }}
{{- end }}
{{- if .Values.sidecars }}
{{- include "common.tplvalues.render" ( dict "value" .Values.sidecars "context" $) | nindent 8 }}
{{- end }}
      volumes:
        - name: passwords
          secret:
            secretName: {{ template "openldap.secretName" . }}
            items:
              - key: LDAP_ADMIN_PASSWORD
                path: ldap-admin-password
{{- if (gt (int (include "openldap.replicaCount" .)) 1) }}                
              - key: LDAP_REPLICATION_PASSWORD
                path: ldap-replication-password
{{- end }}
{{- if .Values.persistence.enabled }}
{{- if .Values.persistence.existingClaims }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaims.config }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaims.data }}
{{- end }}
{{- end }}
        - name: script
          configMap:
            name: {{ template "openldap.fullname" . }}-script
{{- if (gt (int .Values.replication.writeableReplicaCount) 1) }}
        - name: replication
          configMap:
            name: {{ template "openldap.fullname" . }}-replication
{{- end }}
{{- if .Values.customLdifFiles }}
        - name: custom-ldif-files
          configMap:
            name: {{ template "openldap.fullname" . }}-customldif
{{- else if .Values.customLdifCm }}
        - name: custom-ldif-files
          configMap:
            name: {{ .Values.customLdifCm }}
{{- end }}
        - name: ppolicy
          configMap:
            name: {{ template "openldap.fullname" . }}-ppolicy
{{- if .Values.accessLog.enabled }}
        - name: accesslog
          configMap:
            name: {{ template "openldap.fullname" . }}-accesslog
{{- end }}
{{- if .Values.global.allowConfigAccess }}
        - name: logging
          configMap:
            name: {{ template "openldap.fullname" . }}-logging
{{- end }}
{{- if .Values.customSchemaFiles }}
        - name: custom-schema-files
          configMap:
            name: {{ template "openldap.fullname" . }}-customschema
{{- else if .Values.customSchemaCm }}
        - name: custom-schema-files
          configMap:
            name: {{ .Values.customSchemaCm }}
{{- end }}
{{- if .Values.global.tlsSecret }}
        - name: certs
          secret:
            secretName: {{ .Values.global.tlsSecret }}
{{- else if .Values.initTLScerts.enabled }}
        - name: certs
          emptyDir:
            medium: Memory
{{- end }}
{{- range .Values.customFileSets }}
        - name: {{ .name }}
          configMap:
            name: {{ template "openldap.fullname" $ }}-fs-{{ .name }}
{{- end }}
        {{- if .Values.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
{{- if and (not .Values.persistence.existingClaims)  .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: config
        annotations:
        {{- range $key, $value := .Values.persistence.annotations }}
          {{ $key }}: {{ $value }}
        {{- end }}
      spec:
        accessModes:
        {{- range .Values.persistence.accessModes }}
          - {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: "50Mi"
      {{- if .Values.persistence.storageClass }}
      {{- if (eq "-" .Values.persistence.storageClass) }}
        storageClassName: ""
      {{- else }}
        storageClassName: "{{ .Values.persistence.storageClass }}"
      {{- end }}
      {{- end }}
    - metadata:
        name: data
        annotations:
        {{- range $key, $value := .Values.persistence.annotations }}
          {{ $key }}: {{ $value }}
        {{- end }}
      spec:
        accessModes:
        {{- range .Values.persistence.accessModes }}
          - {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
      {{- if .Values.persistence.storageClass }}
      {{- if (eq "-" .Values.persistence.storageClass) }}
        storageClassName: ""
      {{- else }}
        storageClassName: "{{ .Values.persistence.storageClass }}"
      {{- end }}
      {{- end }}
{{- else if (not .Values.persistence.enabled) }}
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
{{- end }}
