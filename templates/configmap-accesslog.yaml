{{- if and .Values.accessLog.enabled .Values.global.allowConfigAccess }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "openldap.fullname" . }}-accesslog
  labels:
    app: {{ template "openldap.name" . }}
    chart: {{ template "openldap.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
{{- if .Values.extraLabels }}
{{ toYaml .Values.extraLabels | indent 4 }}
{{- end }}
data:
  init_accesslog.ldif: |
    dn: cn=module{0},cn=config
    changetype: modify
    add: olcModuleLoad
    olcModuleLoad: accesslog

    dn: olcDatabase={2}mdb,cn=config
    olcDatabase: {2}mdb
    objectClass: olcDatabaseConfig
    objectClass: olcMdbConfig
    olcDbDirectory: ${LDAP_INIT_ACCESSLOG_DATA_DIR}
    olcSuffix: cn=accesslog
    olcRootDN: cn=admin,cn=accesslog
    olcDbIndex: default eq
    olcDbIndex: entryCSN,objectClass,reqEnd,reqResult,reqStart,reqDN
    olcAccess: to *
      by dn="${LDAP_INIT_ROOT_USER_DN}" write
      by group/groupOfUniqueNames/uniqueMember="${LDAP_INIT_ADMIN_GROUP_DN}" write
      by * none

    dn: olcOverlay=accesslog,olcDatabase={1}mdb,cn=config
    olcOverlay: accesslog
    objectClass: olcOverlayConfig
    objectClass: olcAccessLogConfig
    olcAccessLogDB: cn=accesslog
    olcAccessLogOps: {{ .Values.accessLog.operations }}
    olcAccessLogSuccess: TRUE
    # scan the accesslog DB every day, and purge entries older than 7 days
    olcAccessLogPurge: 0{{ .Values.accessLog.purgeAge }}+00:00 0{{ .Values.accessLog.purgeSchedule }}+00:00
{{- end }}
