apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ltb-passwd.fullname" . }}
  labels:
{{ include "ltb-passwd.labels" . | indent 4 }}
spec:
  replicas: {{ default 1 .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ltb-passwd.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ltb-passwd.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- include "ltb-passwd.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.initContainers }}
      initContainers:
      {{- with .Values.initContainers }}
        {{- tpl (toYaml .) $ | nindent 6 }}
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "ltb-passwd.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.global.existingSecret | default .Values.ldap.bindDnSecretName }}
          env:
          {{- with .Values.env }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}          
          volumeMounts:
            - mountPath: /var/www/conf/config.inc.local.php
              name: ldap-conf
              subPath: config.php
          {{- if .Values.ldap.starttls }}
            - name: ldap-tls
              mountPath: /etc/ssl/openldap
              readOnly: true
          {{- end }}
          {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
          {{- end }}
      volumes:
        - name: ldap-conf
          configMap:
            name: {{ include "ltb-passwd.fullname" . }}-ldap
            items:
              - key: config.php
                path: config.php
      {{- if .Values.ldap.starttls }}
        - name: ldap-tls
          secret:
            secretName: {{ .Values.global.tlsSecret | default .Values.ldap.tlsSecretName }}
      {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
