---
# Default values for phpldapadmin.

debug: false

## Set default image, imageTag, and imagePullPolicy. mode is used to indicate the
##
image:
  repository: phpldapadmin/phpldapadmin
  tag: 2.3.10
  pullPolicy: IfNotPresent
  pullSecrets: []

## Number of phpLDAPadmin images
replicaCount: 1

ldap:
  host: localhost
  baseDn: dc=example,dc=com
  starttls: false
  tlsSecretName: ldap-tls
  bindDnSecretName: ldap-bind # Secret containing the password for the bind DN as LDAP_ADMIN_PASSWORD
  loginAttribute: dn
  loginAttributeDesc: "Distinguished Name (DN)"
  loginObjectClass: "inetOrgPerson"
  allowGuest: false

# -- Init containers to add to the pod
## Note: Supports use of custom Helm templates
initContainers: []

# -- Additional volumeMounts to the application main container
volumeMounts: []
#  - mountPath: /usr/local/bin/my_tool
#    name: xxxxxx
#    subPath: foo

# -- Additional volumes to the application pod
volumes: []
#  - name: xxxxx
#    emptyDir: {}

## Expose the pgAdmin service to be accessed from outside the cluster (LoadBalancer service).
## or access it from within the cluster (ClusterIP service). Set the service type and the port to serve it.
## ref: http://kubernetes.io/docs/user-guide/services/
##
service:
  type: ClusterIP
  ## name: phpldapadmin
  port: 80
  annotations: {}

  ## Set the LoadBalancer service type to internal only.
  ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#internal-load-balancer
  ##
  # loadBalancerIP:

  ## Load Balancer sources
  ## https://kubernetes.io/docs/tasks/access-application-cluster/configure-cloud-provider-firewall/#restrict-access-for-loadbalancer-service
  ##
  # loadBalancerSourceRanges:
  # - 10.10.10.0/24

## Configure Ingress based on the documentation here: https://kubernetes.io/docs/concepts/services-networking/ingress/
##
ingress:
  enabled: false
  annotations: {}
  ## See https://kubernetes.io/docs/concepts/services-networking/ingress/#ingressclass-scope
  # ingressClassName: nginx
  path: /
  ## Ingress Host
  # hosts:
  # - phpldapadmin.example.org
  #
  tls: []
  # tls:
  # - secretName: phpldapadmin-dedicated-tls
  #   hosts:
  #   - phpldapadmin.example.org

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 192Mi
  # requests:
  #  cpu: 50m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
